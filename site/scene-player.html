<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In-slide Stickman animation</title>__THEME__
<style>body{margin:0;background:var(--cp-bg);color:var(--cp-text);font-family:"Segoe UI",Aptos,Calibri,sans-serif}#scene svg{width:100%;height:auto;display:block}.controls{display:flex;align-items:center;gap:12px;padding:12px;background:var(--cp-surface)}button{font:inherit;background:var(--cp-surface);color:var(--cp-text);border:1px solid var(--cp-border);border-radius:10px;padding:8px 12px}input{flex:1;accent-color:var(--cp-accent)}:focus-visible{outline:3px solid var(--cp-accent)}.bare .controls{display:none}</style></head><body><div id="scene" aria-label="Stickman moving within slide content"></div><div class="controls"><button id="play">Pause</button><label for="scrub">Timeline</label><input id="scrub" type="range" min="0" max="359" value="0"><output id="frameNo">0</output></div><script id="frames" type="application/json">__FRAMES__</script><script>
const frames=JSON.parse(document.getElementById("frames").textContent),scene=document.getElementById("scene"),scrub=document.getElementById("scrub"),play=document.getElementById("play"),frameNo=document.getElementById("frameNo"),reduced=matchMedia("(prefers-reduced-motion: reduce)"),params=new URLSearchParams(location.search);scrub.max=frames.length-1;let frame=0,playing=!reduced.matches&&params.get("paused")!=="1",last=performance.now();if(params.get("bare")==="1")document.body.classList.add("bare");function draw(){const i=Math.min(frames.length-1,Math.floor(frame));scene.innerHTML=frames[i];scrub.value=i;frameNo.textContent=i;play.textContent=playing?"Pause":frame>=frames.length-1?"Replay":"Play";}play.onclick=()=>{if(!playing&&frame>=frames.length-1)frame=0;playing=!playing;last=performance.now();draw()};scrub.oninput=()=>{playing=false;frame=Number(scrub.value);draw()};reduced.addEventListener("change",()=>{playing=false;draw()});document.addEventListener("visibilitychange",()=>{if(document.hidden){playing=false;draw()}});function tick(now){const dt=(now-last)/1000;last=now;if(playing){frame+=dt*30;if(frame>=frames.length-1){playing=false;frame=frames.length-1;}}draw();requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></body></html>
